# Example fixture patch for MLI-OSC-Bridge.
# Edit to match your grandMA3 patch then run:
#   mli-bridge setup-show --patch patch_example.yaml
#
# Group membership can be defined two ways (both work):
#   1. Explicit:  add fixture_ids: [1, 2] to the group entry (preferred)
#   2. Implicit:  set group: "front_wash" on each fixture (backward compat)
# When fixture_ids is present it takes precedence.

fixtures:
  - id: 1
    name: "Front Wash L"
    fixture_type: "LED PAR"
    universe: 1
    channel: 1
    group: "front_wash"
    position: "front_left"

  - id: 2
    name: "Front Wash R"
    fixture_type: "LED PAR"
    universe: 1
    channel: 7
    group: "front_wash"
    position: "front_right"

  - id: 3
    name: "Back Wash L"
    fixture_type: "LED PAR"
    universe: 1
    channel: 13
    group: "back_wash"
    position: "back_left"

  - id: 4
    name: "Back Wash R"
    fixture_type: "LED PAR"
    universe: 1
    channel: 19
    group: "back_wash"
    position: "back_right"

  - id: 5
    name: "Moving Head L"
    fixture_type: "Moving Head"
    universe: 1
    channel: 25
    group: "moving_heads"
    position: "truss_left"

  - id: 6
    name: "Moving Head R"
    fixture_type: "Moving Head"
    universe: 1
    channel: 40
    group: "moving_heads"
    position: "truss_right"

groups:
  - name: "front_wash"
    label: "Front Wash"
    executor: 2
    ma3_group_id: 2       # MA3 group number used in "Store Group N"
    fixture_ids: [1, 2]   # explicit membership — overrides the group: field on fixtures

  - name: "back_wash"
    label: "Back Wash"
    executor: 3
    ma3_group_id: 3
    fixture_ids: [3, 4]

  - name: "moving_heads"
    label: "Moving Heads"
    executor: 4
    ma3_group_id: 4
    fixture_ids: [5, 6]

presets:
  color:
    - name: "Red"
      rgb: [255, 0, 0]
    - name: "Green"
      rgb: [0, 255, 0]
    - name: "Blue"
      rgb: [0, 0, 255]
    - name: "White"
      rgb: [255, 255, 255]
    - name: "Amber"
      rgb: [255, 191, 0]
    - name: "Deep Blue"
      rgb: [0, 0, 180]
