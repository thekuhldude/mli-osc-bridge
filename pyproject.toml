[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mli-osc-bridge"
version = "0.1.0"
description = "Real-time audio-to-grandMA3 OSC bridge for synchronized light shows"
requires-python = ">=3.11"
dependencies = [
    "python-osc>=1.8.3",
    "librosa>=0.10.0",
    "sounddevice>=0.4.6",
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "loguru>=0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
mli-bridge = "mli_bridge.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mli_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
]
